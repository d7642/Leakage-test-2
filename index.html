    <script data-filename="pages/DownloadVersion" data-linenumber="150" data-visual-selector-id="pages/DownloadVersion150">
        let scanData = {};

        // Cookie Functions
        function acceptCookies() {
            localStorage.setItem('cookie_consent', JSON.stringify({accepted: true, timestamp: new Date().toISOString()}));
            document.getElementById('cookieBanner').classList.add('hidden');
        }

        function rejectCookies() {
            localStorage.setItem('cookie_consent', JSON.stringify({accepted: false, timestamp: new Date().toISOString()}));
            document.getElementById('cookieBanner').classList.add('hidden');
        }

        // Check cookie consent on load
        if (!localStorage.getItem('cookie_consent')) {
            document.getElementById('cookieBanner').classList.remove('hidden');
        }

        // Scan Functions
        async function runScan() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('scanIcon').classList.add('animate-spin');
            document.getElementById('scanText').textContent = 'סורק...';

            try {
                const [ipData, webrtcData, fingerprints, deviceInfo] = await Promise.all([
                    fetchIPData(),
                    detectWebRTC(),
                    getFingerprints(),
                    getDeviceInfo()
                ]);

                scanData = {
                    ip: ipData,
                    webrtc: webrtcData,
                    fingerprints: fingerprints,
                    device: deviceInfo,
                    browser: getBrowserInfo(),
                    security: getSecurityInfo(),
                    vpn: detectVPN(ipData)
                };

                displayResults();
                
                const now = new Date();
                document.getElementById('scanTime').textContent = now.toLocaleTimeString('he-IL');
                document.getElementById('lastScan').classList.remove('hidden');
            } catch (error) {
                console.error('Scan error:', error);
            }

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('scanIcon').classList.remove('animate-spin');
            document.getElementById('scanText').textContent = 'סרוק מחדש';
        }

        async function fetchIPData() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                return await response.json();
            } catch (e) {
                const response = await fetch('https://ip-api.com/json/');
                const data = await response.json();
                return {
                    ip: data.query,
                    city: data.city,
                    country_name: data.country,
                    org: data.isp,
                    timezone: data.timezone,
                    asn: data.as
                };
            }
        }

        function detectWebRTC() {
            return new Promise((resolve) => {
                const ips = { local: [], public: [] };
                if (typeof RTCPeerConnection === 'undefined') {
                    resolve({ supported: false, ips });
                    return;
                }
                
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                
                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        pc.close();
                        resolve({ supported: true, ips, leaking: ips.local.length > 0 || ips.public.length > 0 });
                        return;
                    }
                    
                    const candidate = e.candidate.candidate;
                    const ipMatch = candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                    
                    if (ipMatch) {
                        const ip = ipMatch[0];
                        if (ip.startsWith('192.168.') || ip.startsWith('10.')) {
                            if (!ips.local.includes(ip)) ips.local.push(ip);
                        } else {
                            if (!ips.public.includes(ip)) ips.public.push(ip);
                        }
                    }
                };
                
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                setTimeout(() => { pc.close(); resolve({ supported: true, ips, leaking: ips.local.length > 0 || ips.public.length > 0 }); }, 3000);
            });
        }

        function getFingerprints() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillStyle = '#f60';
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = '#069';
            ctx.fillText('Test', 2, 15);
            
            let hash = 0;
            const dataUrl = canvas.toDataURL();
            for (let i = 0; i < dataUrl.length; i++) {
                hash = ((hash << 5) - hash) + dataUrl.charCodeAt(i);
            }

            return {
                canvas: Math.abs(hash).toString(16).substring(0, 12),
                webgl: getWebGL(),
                fonts: detectFonts()
            };
        }

        function getWebGL() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                if (!gl) return 'not-supported';
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }
                return 'hidden';
            } catch (e) {
                return 'blocked';
            }
        }

        function detectFonts() {
            const fonts = ['Arial', 'Verdana', 'Times New Roman', 'Georgia', 'Courier New'];
            return fonts.length;
        }

        function getDeviceInfo() {
            return {
                screen: window.screen.width + 'x' + window.screen.height,
                cores: navigator.hardwareConcurrency || 'Unknown',
                memory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown',
                touch: navigator.maxTouchPoints || 0,
                connection: navigator.connection ? navigator.connection.effectiveType : 'Unknown'
            };
        }

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Safari')) browser = 'Safari';
            
            return {
                name: browser,
                language: navigator.language,
                platform: navigator.platform
            };
        }

        function getSecurityInfo() {
            return {
                cookies: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack === '1',
                adBlocker: false // Simplified
            };
        }

        function detectVPN(ipData) {
            if (!ipData) return { detected: false };
            const vpnKeywords = ['vpn', 'proxy', 'hosting', 'datacenter', 'cloud'];
            const orgLower = (ipData.org || '').toLowerCase();
            const detected = vpnKeywords.some(k => orgLower.includes(k));
            return { detected };
        }

        function displayResults() {
            const checks = [
                { title: 'כתובת IP', value: scanData.ip?.ip || 'Unknown', status: 'danger' },
                { title: 'VPN', value: scanData.vpn.detected ? 'זוהה' : 'לא זוהה', status: scanData.vpn.detected ? 'safe' : 'warning' },
                { title: 'דליפת WebRTC', value: scanData.webrtc.leaking ? 'דולף' : 'מאובטח', status: scanData.webrtc.leaking ? 'danger' : 'safe' },
                { title: 'מיקום', value: scanData.ip?.city + ', ' + scanData.ip?.country_name, status: 'warning' },
                { title: 'ספק אינטרנט', value: scanData.ip?.org || 'Unknown', status: 'info' },
                { title: 'דפדפן', value: scanData.browser.name, status: 'info' },
                { title: 'רזולוציה', value: scanData.device.screen, status: 'info' },
                { title: 'ליבות CPU', value: scanData.device.cores, status: 'info' },
                { title: 'זיכרון', value: scanData.device.memory, status: 'info' },
                { title: 'Canvas FP', value: scanData.fingerprints.canvas, status: 'warning' },
                { title: 'WebGL', value: scanData.fingerprints.webgl, status: 'warning' },
                { title: 'קוקיז', value: scanData.security.cookies ? 'מופעל' : 'כבוי', status: 'info' }
            ];

            let safe = 0, warning = 0, danger = 0;
            checks.forEach(c => {
                if (c.status === 'safe') safe++;
                else if (c.status === 'warning') warning++;
                else if (c.status === 'danger') danger++;
            });

            document.getElementById('totalChecks').textContent = checks.length;
            document.getElementById('safeChecks').textContent = safe;
            document.getElementById('warningChecks').textContent = warning;
            document.getElementById('dangerChecks').textContent = danger;

            const score = Math.round((safe / checks.length) * 100);
            document.getElementById('scoreText').textContent = score + '%';
            document.getElementById('progressBar').style.width = score + '%';
            
            let statusText = 'מצוין';
            if (danger >= 3) statusText = 'חלש - יש דליפות';
            else if (danger >= 1) statusText = 'בינוני';
            else if (warning >= 2) statusText = 'טוב';
            document.getElementById('statusText').textContent = statusText;

            const container = document.getElementById('checksContainer');
            container.innerHTML = '';
            
            checks.forEach(check => {
                const colors = {
                    safe: 'border-emerald-500/30 bg-emerald-500/10',
                    warning: 'border-amber-500/30 bg-amber-500/10',
                    danger: 'border-red-500/30 bg-red-500/10',
                    info: 'border-cyan-500/30 bg-cyan-500/10'
                };
                
                const badge = {
                    safe: '<span data-filename="pages/DownloadVersion" data-linenumber="398" data-visual-selector-id="pages/DownloadVersion398" class="text-emerald-400">✓ מאובטח</span>',
                    warning: '<span data-filename="pages/DownloadVersion" data-linenumber="399" data-visual-selector-id="pages/DownloadVersion399" class="text-amber-400">⚠ אזהרה</span>',
                    danger: '<span data-filename="pages/DownloadVersion" data-linenumber="400" data-visual-selector-id="pages/DownloadVersion400" class="text-red-400">✗ נחשף</span>',
                    info: '<span data-filename="pages/DownloadVersion" data-linenumber="401" data-visual-selector-id="pages/DownloadVersion401" class="text-cyan-400">ℹ מידע</span>'
                };

                container.innerHTML += `
                    <div data-filename="pages/DownloadVersion" data-linenumber="405" data-visual-selector-id="pages/DownloadVersion405" class="card border ${colors[check.status]} rounded-xl p-4 mb-4">
                        <div data-filename="pages/DownloadVersion" data-linenumber="406" data-visual-selector-id="pages/DownloadVersion406" class="flex justify-between items-center">
                            <div data-filename="pages/DownloadVersion" data-linenumber="407" data-visual-selector-id="pages/DownloadVersion407">
                                <h3 data-filename="pages/DownloadVersion" data-linenumber="408" data-visual-selector-id="pages/DownloadVersion408" class="font-medium text-white">${check.title}</h3>
                                <code data-filename="pages/DownloadVersion" data-linenumber="409" data-visual-selector-id="pages/DownloadVersion409" class="text-sm text-slate-300 bg-slate-800/50 px-2 py-1 rounded mt-1 inline-block">${check.value}</code>
                            </div>
                            <div data-filename="pages/DownloadVersion" data-linenumber="411" data-visual-selector-id="pages/DownloadVersion411" class="text-sm">${badge[check.status]}</div>
                        </div>
                    </div>
                `;
            });
        }

        // Run scan on page load
        window.onload = () => {
            setTimeout(runScan, 500);
        };
    </script>
</body>
