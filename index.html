<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CyberScan Elite - System Audit</title>
    <style>
        :root { --bg-color: #050505; --panel-color: #0f1115; --text-primary: #e0e0e0; --accent-color: #ff3333; --success-color: #00ff41; --border-color: #333; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 50%, #1a0505 0%, #000 100%); }
        .container { max-width: 900px; margin: 30px auto; padding: 20px; width: 100%; }
        header { border-bottom: 2px solid var(--accent-color); padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand h1 { color: var(--accent-color); text-transform: uppercase; margin: 0; font-size: 24px; text-shadow: 0 0 10px var(--accent-color); }
        .stat-box { background: var(--panel-color); border: 1px solid var(--border-color); padding: 15px; text-align: center; border-radius: 4px; }
        .item { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 3px 8px; font-size: 11px; border: 1px solid; border-radius: 2px; }
        .badge-good { color: var(--success-color); border-color: var(--success-color); }
        .badge-bad { color: var(--accent-color); border-color: var(--accent-color); }
        button { background: #000; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: var(--accent-color); color: #000; }
        #resultsArea { background: rgba(15, 17, 21, 0.8); border: 1px solid var(--border-color); margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand"><h1>CyberScan Elite</h1></div>
        <button onclick="Scanner.run()">🚀 הרץ סריקה מקיפה</button>
    </header>

    <div class="stat-box" style="margin-top:20px;">
        <span id="score" style="font-size:28px;">100/100</span><br>ציון אבטחה
    </div>

    <div id="resultsArea"></div>
</div>

<footer style="text-align: center; padding: 20px; color: #555;">
    לפניות ואישור שימוש: 
    <span id="safeEmail" style="color:var(--accent-color); cursor:pointer; font-family:monospace;">Loading...</span>
</footer>

<script>
    const Scanner = {
        // מנוע שיוצר בדיקות אוטומטית מתוך אובייקטים של הדפדפן
        run() {
            const area = document.getElementById('resultsArea');
            area.innerHTML = '';
            let score = 100;

            // בדיקות אוטומטיות שחוסכות כתיבת 200 שורות
            const propsToScan = [
                { name: 'HTTPS', check: () => location.protocol === 'https:' },
                { name: 'Cookies Enabled', check: () => navigator.cookieEnabled },
                { name: 'Java Enabled', check: () => navigator.javaEnabled() },
                { name: 'WebAssembly', check: () => typeof WebAssembly === 'object' },
                { name: 'Touch Screen', check: () => navigator.maxTouchPoints > 0 },
                { name: 'Do Not Track', check: () => navigator.doNotTrack !== '1' },
                { name: 'WebGL Support', check: () => !!document.createElement('canvas').getContext('webgl') }
            ];

            propsToScan.forEach(p => {
                const passed = p.check();
                if(!passed) score -= 5;
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span>${p.name}</span><span class="badge ${passed ? 'badge-good' : 'badge-bad'}">${passed ? 'OK' : 'FAIL'}</span>`;
                area.appendChild(div);
            });

            document.getElementById('score').innerText = Math.max(0, score) + "/100";
        }
    };

    // הגנה על המייל
    const u = "hacker.david.7642", d = "gmail.com";
    const el = document.getElementById('safeEmail');
    el.innerText = `${u}@${d}`;
    el.onclick = () => {
        window.location.href = `mailto:${u}@${d}?subject=CyberScan Inquiry&body=שלום, אני פונה בנוגע לסריקה שביצעתי באתר.`;
    };
</script>

</body>
</html>
